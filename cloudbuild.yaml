# Google Cloud Build Pipeline Configuration
steps:
  # 1. Build Docker Container
  - name: 'gcr.io/cloud-builders/docker'
    args: ['build', '-t', 'gcr.io/$PROJECT_ID/omnisales-bi-dashboard:$BUILD_ID', '-t', 'gcr.io/$PROJECT_ID/omnisales-bi-dashboard:latest', '.']

  # 2. Push Image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args: ['push', 'gcr.io/$PROJECT_ID/omnisales-bi-dashboard:$BUILD_ID']

  # 3. Deploy to Google Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'omnisales-bi-dashboard'
      - '--image'
      - 'gcr.io/$PROJECT_ID/omnisales-bi-dashboard:$BUILD_ID'
      - '--region'
      - 'us-central1'
      - '--platform'
      - 'managed'
      - '--allow-unauthenticated'
      - '--port'
      - '8080'
      - '--memory'
      - '2Gi'
      - '--cpu'
      - '2'

images:
  - 'gcr.io/$PROJECT_ID/omnisales-bi-dashboard:$BUILD_ID'
  - 'gcr.io/$PROJECT_ID/omnisales-bi-dashboard:latest'

options:
  logging: CLOUD_LOGGING_ONLY
